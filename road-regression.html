<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Baccarat Road Regression Tests</title><style>body{background:#101b2b;color:#edf4ff;font:16px system-ui;max-width:760px;margin:auto;padding:18px}li{padding:9px;border-bottom:1px solid #354b65}.ok{color:#91e6b0}.fail{color:#ffb1a8}a{color:#9dc9ff}</style><h1>Road regression tests</h1><p>Read-only checks against the PDF page 2 shoe and chronological consistency. Does not modify saved results.</p><ol id="results"></ol><p id="summary"></p><p><a href="index.html">Back to analyzer</a></p><script src="roadmaps.js"></script><script>
const shoe="T P P B P P P T T P B B B B B T P B P P B T B P B B B B P T B B P B B B B B B P P B B P P B P B P B B B B B P P P B P B B B P P P P P B".split(/\s+/);
const tests=[];function check(name,pass,detail=''){tests.push({name,pass,detail})}
const big=BaccaratRoads.buildBig(shoe);
const runs=[];for(const c of big.cells){if(c.run===0)runs.push({v:c.v,n:0});runs[runs.length-1].n++}
check('PDF shoe totals',shoe.length===68&&shoe.filter(x=>x==='B').length===35&&shoe.filter(x=>x==='P').length===27&&shoe.filter(x=>x==='T').length===6,shoe.length+' hands');
check('First Big Road circle is Player with opening Tie',big.cells[0]?.v==='P'&&big.cells[0]?.tie===1);
check('Big Road opening streaks',runs.slice(0,10).map(x=>x.v+x.n).join(',')==='P2,B1,P4,B5,P1,B1,P2,B2,P1,B4');
check('Big Road has 28 streaks',runs.length===28);
for(const offset of [1,2,3]){const label=['','Big Eye Boy','Small Road','Cockroach Pig'][offset];const full=BaccaratRoads.derived(big,offset);let good=true,at=0;for(let k=1;k<=shoe.length;k++){const partial=BaccaratRoads.derived(BaccaratRoads.buildBig(shoe.slice(0,k)),offset);for(let i=0;i<partial.length;i++)if(!full[i]||['v','c','r'].some(key=>partial[i][key]!==full[i][key])){good=false;at=k;break}if(!good)break}check(label+' chronological stability',good,good?'68 prefixes': 'First failure at hand '+at);const occupied=new Set();let duplicate=false;for(const c of full){const p=c.c+','+c.r;if(occupied.has(p))duplicate=true;occupied.add(p)}check(label+' has no overlapping cells',!duplicate,full.length+' marks')}
// Independently compute derived colors from the physical Big Road cell grid.
// This is intentionally separate from the production streak-length formula.
function physicalDerived(offset){
 const occupied=new Set(big.cells.map(x=>x.c+','+x.r));
 const marks=[];let currentRun=-1;
 for(const cell of big.cells){
  if(cell.run===0)currentRun++;
  if(currentRun<offset||(currentRun===offset&&cell.run===0))continue;
  const anchor=cell.anchor;
  let red;
  if(cell.run===0){
   const height=col=>{let n=0;while(occupied.has(col+','+n))n++;return n};
   red=height(anchor-1)===height(anchor-offset-1);
  }else{
   const reference=anchor-offset;
   red=occupied.has(reference+','+cell.run)===occupied.has(reference+','+(cell.run-1));
  }
  marks.push(red?'B':'P');
 }
 return marks;
}
for(const offset of [1,2,3]){
 const expected=physicalDerived(offset);
 const actual=BaccaratRoads.derived(big,offset).map(x=>x.v);
 const first=expected.findIndex((x,i)=>x!==actual[i]);
 check(['','Big Eye Boy','Small Road','Cockroach Pig'][offset]+' physical-cell cross-check',expected.length===actual.length&&first===-1,first>=0?'First difference at mark '+(first+1):expected.length+' signals compared');
}
const small=BaccaratRoads.derived(big,2);const top=small.filter(x=>x.r===0&&x.c<24).sort((a,b)=>a.c-b.c);check('PDF Small Road top row (24 circles)',top.length===24&&top.every((x,i)=>x.c===i&&x.v===(i%2?'P':'B')),'Red/blue alternating in screenshot');const c7r2=small.find(x=>x.c===6&&x.r===1);check('PDF Small Road C7 R2 (red)',!!c7r2&&c7r2.v==='B',c7r2?'Generated '+(c7r2.v==='B'?'red':'blue'):'Generated empty — unresolved reference mismatch');
const root=document.getElementById('results');for(const t of tests){const li=document.createElement('li');li.className=t.pass?'ok':'fail';li.textContent=(t.pass?'PASS: ':'REVIEW: ')+t.name+(t.detail?' — '+t.detail:'');root.appendChild(li)}document.getElementById('summary').textContent=tests.filter(x=>x.pass).length+' of '+tests.length+' checks pass. REVIEW marks a reference disagreement, not necessarily an algorithm defect.';
</script></html>
