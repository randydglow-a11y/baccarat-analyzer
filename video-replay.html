<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>41-hand Video Replay</title><style>body{background:#101b2b;color:#eef4ff;font:16px system-ui;margin:20px auto;max-width:900px;padding:0 15px}a{color:#a9caff}.panel{background:#1c2b41;border-radius:12px;padding:15px;margin:14px 0;overflow:auto}input{width:100%}button{padding:12px 18px;border-radius:9px;background:#e8efff;border:0;margin:4px}.road{display:grid;grid-auto-flow:column;grid-template-rows:repeat(6,24px);grid-auto-columns:24px;width:max-content;min-width:100%;background:repeating-linear-gradient(90deg,transparent 0 23px,#42546c 23px 24px),repeating-linear-gradient(0deg,transparent 0 23px,#42546c 23px 24px)}.dot{width:17px;height:17px;margin:3px;border-radius:50%;box-sizing:border-box}.red{background:#f33}.blue{background:#3989ff}.hollow.red{background:transparent;border:3px solid #f33}.hollow.blue{background:transparent;border:3px solid #3989ff}.note{color:#ffd188}</style><h1>Video Shoe Replay</h1><p>Replay the exact 41 results from your screen recording. This is a read-only comparison tool; it does not affect the live analyzer or saved shoe.</p><div class="panel"><label for="hand">Hand <strong id="count">7</strong> of 41</label><input id="hand" type="range" min="0" max="41" value="7"><div><button id="prev">Previous</button><button id="next">Next</button><button id="reset">Start over</button></div><p id="result"></p><p id="checkpoint" class="note"></p></div><div id="roads"></div><p><a href="index.html">Back to analyzer</a></p><script src="roadmaps.js"></script><script>const shoe="TPPBPPPTTPBBBBBTPBPPBTBPBBBBPTBBPBBBBBBPP".split("");const slider=document.querySelector('#hand');const labels=['Big Road','Big Eye Boy','Small Road','Cockroach Pig'];const roads=document.querySelector('#roads');for(let i=0;i<4;i++){const p=document.createElement('div');p.className='panel';const h=document.createElement('h2');h.textContent=labels[i];p.append(h);const g=document.createElement('div');g.className='road';g.id='r'+i;p.append(g);roads.append(p)}function render(){const n=+slider.value;document.querySelector('#count').textContent=n;document.querySelector('#result').textContent=n?'Hand '+n+': '+({B:'Banker',P:'Player',T:'Tie'}[shoe[n-1]])+' | '+shoe.slice(0,n).join(' '):'Empty shoe';const big=BaccaratRoads.buildBig(shoe.slice(0,n));const sets=[big.cells,BaccaratRoads.derived(big,1),BaccaratRoads.derived(big,2),BaccaratRoads.derived(big,3)];sets.forEach((cells,i)=>{const g=document.querySelector('#r'+i);g.replaceChildren();g.style.gridTemplateColumns='repeat('+Math.max(12,...cells.map(c=>c.c+1)) +',24px)';for(const c of cells){const el=document.createElement('span');el.className='dot '+(c.v==='B'?'red':'blue')+(i===0||i===1?' hollow':'');el.style.gridColumn=c.c+1;el.style.gridRow=c.r+1;g.append(el)}});const ck=document.querySelector('#checkpoint');ck.textContent=n===5?'VIDEO REFERENCE: Small Road empty.':n===6?'VIDEO REFERENCE: one red Small Road circle.':n===7?'VIDEO REFERENCE: two red Small Road circles stacked. Current algorithm differs at hand 7.':n===41?'VIDEO REFERENCE: 41-hand final screen. Compare the generated roads above.':'Video checkpoint: no manually verified observation for this hand.'}slider.oninput=render;document.querySelector('#prev').onclick=()=>{slider.value=Math.max(0,+slider.value-1);render()};document.querySelector('#next').onclick=()=>{slider.value=Math.min(41,+slider.value+1);render()};document.querySelector('#reset').onclick=()=>{slider.value=0;render()};render();</script></html>
